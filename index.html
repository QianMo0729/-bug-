          ctx.beginPath();
          ctx.moveTo(gx + tile * 0.24, gy + tile * 0.2); ctx.lineTo(gx + tile * 0.76, gy + tile * 0.82);
          ctx.stroke();
          txt(ctx, dd && dd.kind === "origin" ? "门·回原点" : "门·死路", gx + tile / 2, gy - 14, Math.max(9, tile * 0.3), C.amber, "center", "700");
        }
      }
      // 收束点位（focus pads）：发光 ⟳ 圆环 + 行标签
      const focs = FILES[state.activeFile].focus;
      if (focs) for (const fp of focs) {
        const cx0 = toX(fp.x) + tile / 2, cy0 = toY(fp.y) + tile / 2;
        const pulse = 0.5 + 0.35 * Math.sin(state.t * 4 + fp.x);
        const col = fp.locked ? "245,197,66" : "0,185,199";
        ctx.fillStyle = `rgba(${col},${(pulse * 0.18).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(cx0, cy0, tile * 0.5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = `rgba(${col},${pulse.toFixed(2)})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(cx0, cy0, tile * 0.34, 0.4, Math.PI * 1.75); ctx.stroke();
        const ang = Math.PI * 1.75;
        ctx.fillStyle = fp.locked ? C.amber : C.cyan;
        ctx.fillRect(cx0 + Math.cos(ang) * tile * 0.34 - 2, cy0 + Math.sin(ang) * tile * 0.34 - 2, 4, 4);
        txt(ctx, fp.label, cx0, cy0 - tile * 0.5 - 13, Math.max(9, tile * 0.32), fp.locked ? C.amber : C.green2, "center", "700");
      }
      // 碎片拾取物（发光 </>）
      const pus = FILES[state.activeFile].pickups;
      if (pus) for (const pk of pus) {
        if (state.pickedUp.includes(pickupKey(pk))) continue;
        const cx1 = toX(pk.x) + tile / 2, cy1 = toY(pk.y) + tile / 2 + Math.sin(state.t * 3 + pk.x) * 2;
        ctx.fillStyle = `rgba(0,255,102,${(0.14 + 0.1 * Math.sin(state.t * 4 + pk.x)).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(cx1, cy1, tile * 0.4, 0, Math.PI * 2); ctx.fill();
        drawSprite(A.shard, cx1 - tile * 0.36, cy1 - tile * 0.38, tile / 16 * 0.72);
      }
      if (state.activeFile === "backlog.py" && state.t < state.hiddenGateT) drawHiddenGateOverlay(rect, tile, camX, camY);
    }

    function drawHiddenGateOverlay(rect, tile, camX, camY) {
      const x = rect.x + (8 + 0.5) * tile - camX;
      const y = rect.y + (8 + 0.5) * tile - camY;
      const missing = hiddenGateMissing();
      ctx.save();
      ctx.globalAlpha = 0.92;
      ctx.strokeStyle = C.amber;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, tile * (0.82 + 0.08 * Math.sin(state.t * 9)), 0, Math.PI * 2);
      ctx.stroke();
      const w = Math.min(rect.w - 28, 260), h = 54;
      const bx = clamp(x - w / 2, rect.x + 10, rect.x + rect.w - w - 10);
      const by = clamp(y - tile * 2.2, rect.y + 10, rect.y + rect.h - h - 10);
      px(ctx, bx, by, w, h, "rgba(36,28,6,0.92)");
      ctx.strokeRect(bx + 0.5, by + 0.5, w - 1, h - 1);
      txt(ctx, "scanner.py 证据锁", bx + 10, by + 8, 11, C.amber, "left", "700");
      txt(ctx, fitLine("缺：" + missing.join(" / "), w - 20, 10, "700"), bx + 10, by + 27, 10, C.cream, "left", "700");
      ctx.restore();
    }

    function bugPosition(b) {
      const t = state.t * b.speed + b.phase;
      let x = b.homeX, y = b.homeY;
      if (b.patrol === "h") x += Math.sin(t) * b.amp;
      else if (b.patrol === "v") y += Math.sin(t) * b.amp;
      else {
        x += Math.cos(t) * b.amp;
        y += Math.sin(t) * b.amp * 0.55;
      }
      return { x, y };
    }
    function drawBugs(rect, tile, camX, camY) {
      for (const b of state.map.bugs) {
        const pos = bugPosition(b);
        const hx = rect.x + (b.homeX + 0.5) * tile - camX;
        const hy = rect.y + (b.homeY + 0.5) * tile - camY;
        ctx.save();
        ctx.globalAlpha = b.extra ? 0.7 : 0.45;
        ctx.strokeStyle = b.extra ? "rgba(255,107,107,0.55)" : "rgba(255,42,42,0.35)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        if (b.patrol === "h") {
          ctx.moveTo(hx - b.amp * tile, hy);
          ctx.lineTo(hx + b.amp * tile, hy);
        } else if (b.patrol === "v") {
          ctx.moveTo(hx, hy - b.amp * tile);
          ctx.lineTo(hx, hy + b.amp * tile);
        } else {
          ctx.ellipse(hx, hy, b.amp * tile, b.amp * tile * 0.55, 0, 0, Math.PI * 2);
        }
        ctx.stroke();
        ctx.restore();

        const bob = Math.sin(state.t * 5 + b.t) * tile * 0.08;
        const sx = rect.x + pos.x * tile - camX, sy = rect.y + pos.y * tile - camY + bob;
        const heat = 0.22 + 0.12 * Math.sin(state.t * 6 + b.phase);
        ctx.fillStyle = `rgba(255,42,42,${heat.toFixed(3)})`;
        ctx.beginPath();
        ctx.arc(sx + tile * 0.5, sy + tile * 0.55, tile * (b.extra ? 0.55 : 0.45), 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(255,42,42,0.18)";
        ctx.fillRect(sx + tile * 0.18, sy + tile * 0.7, tile * 0.64, tile * 0.18);
        drawSprite(A.bug, sx + tile * 0.12, sy + tile * 0.06, tile / 16 * (b.extra ? 0.9 : 0.82));
      }
    }

    function drawBot(rect, tile, camX, camY) {
      const bp = state.map.botPos;
      const bob = Math.sin(state.t * 2.4) * tile * 0.1;
      const sx = rect.x + bp.x * tile - camX, sy = rect.y + bp.y * tile - camY + bob;
      ctx.fillStyle = "rgba(0,185,199,0.16)";
      ctx.fillRect(sx + tile * 0.2, sy + tile * 0.78, tile * 0.6, tile * 0.16);
      drawSprite(A.bot, sx + tile * 0.1, sy, tile / 16 * 0.9);
      // 头顶提示符
      if (state.t < state.bot.until) {
        const py = sy - tile * 0.35 + Math.sin(state.t * 4) * 2;
        txt(ctx, "!", sx + tile * 0.5, py, tile * 0.4, C.green2, "center", "900");
      }
    }

    function drawPlayer(rect, tile, camX, camY) {
      const p = state.player;
      const img = A.player[p.dir][p.frame];
      const sx = rect.x + p.fx * tile - camX + (tile - 16 * (tile / 16)) / 2;
      const sy = rect.y + p.fy * tile - camY - tile * 0.28;
      const scale = tile / 16;
      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.fillRect(sx + tile * 0.18, sy + tile * 1.12, tile * 0.64, tile * 0.16);
      drawSprite(img, sx, sy, scale);
    }

    function drawStatus(rect) {
      px(ctx, rect.x, rect.y, rect.w, rect.h, "#06140d");
      px(ctx, rect.x, rect.y, rect.w, 2, "#0c2d1e");
      const ty = rect.y + 8;
      // CPU 温度
      txt(ctx, "CPU", 12, ty, 12, C.greenDim, "left", "700");
      const heat = state.cpuHeat;
      const heatCol = heat >= 85 ? C.red : heat >= 60 ? C.amber : C.green2;
      txt(ctx, heat + "°C", 44, ty, 12, heatCol, "left", "700");
      // 时间（随进度增加；>3h 触发睡意 Boss——待接）
      const timeCol = state.gameTime >= 3 ? C.red2 : state.gameTime >= 2 ? C.amber : C.cyan;
      txt(ctx, "· " + state.gameTime.toFixed(1) + "h", 90, ty, 12, timeCol, "left", "700");
      txt(ctx, "· DEBT " + state.techDebt, 142, ty, 12, C.greenDim, "left", "700");
      const ideaX = rect.w < 390 ? 210 : 224;
      txt(ctx, "· IDEA " + state.insight, ideaX, ty, 12, state.comboUntil > state.t ? C.amber : C.greenDim, "left", "700");
      // 面包屑（当前文件 › 关键调用）
      const f = FILES[state.activeFile];
      const compact = rect.w < 430;
      const full = compact ? f.title : f.title + " › " + f.crumb;
      ctx.font = '700 11px "Microsoft YaHei","PingFang SC",monospace';
      const maxW = compact ? 74 : rect.w * 0.5;
      let crumb = full;
      if (ctx.measureText(full).width > maxW) {
        while (crumb.length > 3 && ctx.measureText(crumb + "…").width > maxW) crumb = crumb.slice(0, -1);
        crumb += "…";
      }
      txt(ctx, crumb, rect.w - 12, ty, 11, "#7fffc4", "right", "700");
    }

    function drawTabs(rect) {
      px(ctx, rect.x, rect.y, rect.w, rect.h, C.panel);
      ctx.font = '700 12px "Microsoft YaHei","PingFang SC",monospace';
      // 先量出所有标签（含锁定的下一个）的宽度和位置
      const items = [];
      let ax = 12;
      for (const f of state.openedFiles) {
        if (FILES[f] && FILES[f].roomOnly) continue;   // 房间型伪文件不进标签栏（如列表房，仍显示在 main.py 名下）
        const tw = Math.max(82, ctx.measureText(f).width + 26);
        items.push({ kind: "tab", f, label: f, x0: ax, tw }); ax += tw + 8;
      }
      const next = FILE_ORDER.find(n => !state.openedFiles.includes(n));
      if (next) {
        const label = next.replace(".py", "");
        const tw = Math.max(64, ctx.measureText(label).width + 30);
        items.push({ kind: "lock", label, x0: ax, tw }); ax += tw + 8;
      }
      const total = ax;
      const overflow = total > rect.w;
      const arrowW = overflow ? 58 : 0;         // 两个箭头各 26 + 间隙
      const viewW = rect.w - arrowW;            // 右侧给滚动箭头留位
      // 自动滚动：让当前标签始终在可视区内
      const act = items.find(t => t.f === state.activeFile);
      if (act) {
        if (act.x0 - state.tabScroll < 8) state.tabScroll = act.x0 - 8;
        else if (act.x0 + act.tw - state.tabScroll > viewW - 8) state.tabScroll = act.x0 + act.tw - viewW + 8;
      }
      const maxScroll = Math.max(0, total - viewW);
      state.tabScroll = clamp(state.tabScroll, 0, maxScroll);
      // 裁剪标签区，画标签（带横向滚动偏移）
      ctx.save();
      ctx.beginPath(); ctx.rect(rect.x, rect.y, viewW, rect.h); ctx.clip();
      for (const t of items) {
        const x = t.x0 - state.tabScroll;
        if (x + t.tw < rect.x || x > rect.x + viewW) continue;   // 完全不可见就跳过
        if (t.kind === "tab") {
          const active = t.f === state.activeFile;
          px(ctx, x, rect.y + 6, t.tw, 22, active ? "#08231a" : "#06120c");
          ctx.strokeStyle = active ? C.green : C.greenDark; ctx.lineWidth = active ? 2 : 1;
          ctx.strokeRect(x + 1, rect.y + 7, t.tw - 2, 20);
          if (active) px(ctx, x, rect.y + 6, t.tw, 2, C.green);
          txt(ctx, t.f, x + 13, rect.y + 11, 12, active ? C.green2 : C.greenDim, "left", "700");
          const fx = t.f, bxr = Math.max(rect.x, x), bwr = Math.min(x + t.tw, rect.x + viewW) - bxr;
          if (bwr > 8) state.buttons.push({ x: bxr, y: rect.y + 6, w: bwr, h: 22, tap: () => switchTab(fx) });
        } else {
          px(ctx, x, rect.y + 6, t.tw, 22, "#0c0a06");
          ctx.strokeStyle = "#3a2a0a"; ctx.lineWidth = 1; ctx.strokeRect(x + 1, rect.y + 7, t.tw - 2, 20);
          txt(ctx, "🔒", x + 7, rect.y + 11, 11, "#7a5a1a", "left");
          txt(ctx, t.label, x + 24, rect.y + 11, 12, "#6a5a2a", "left", "700");
          const bxr = Math.max(rect.x, x), bwr = Math.min(x + t.tw, rect.x + viewW) - bxr;
          if (bwr > 8) state.buttons.push({ x: bxr, y: rect.y + 6, w: bwr, h: 22, tap: () => showBot(BOT_LINES.doorLocked) });
        }
      }
      ctx.restore();
      // 横向滚动箭头（标签放不下时才出现，叠在最右侧）
      if (overflow) {
        const bw = 26, bx = rect.x + rect.w - bw - 2, byTop = rect.y + 6;
        px(ctx, bx, byTop, bw, 22, "#06120c");
        ctx.strokeStyle = state.tabScroll < maxScroll ? C.green : C.greenDark; ctx.lineWidth = 1;
        ctx.strokeRect(bx + 0.5, byTop + 0.5, bw - 1, 21);
        txt(ctx, "›", bx + bw / 2, rect.y + 9, 16, state.tabScroll < maxScroll ? C.green2 : "#2a4a3a", "center", "700");
        state.buttons.push({ x: bx, y: byTop, w: bw, h: 22, tap: () => { state.tabScroll = clamp(state.tabScroll + 110, 0, maxScroll); } });
        const bx2 = bx - bw - 2;
        px(ctx, bx2, byTop, bw, 22, "#06120c");
        ctx.strokeStyle = state.tabScroll > 0 ? C.green : C.greenDark; ctx.lineWidth = 1;
        ctx.strokeRect(bx2 + 0.5, byTop + 0.5, bw - 1, 21);
        txt(ctx, "‹", bx2 + bw / 2, rect.y + 9, 16, state.tabScroll > 0 ? C.green2 : "#2a4a3a", "center", "700");
        state.buttons.push({ x: bx2, y: byTop, w: bw, h: 22, tap: () => { state.tabScroll = clamp(state.tabScroll - 110, 0, maxScroll); } });
      }
    }

    function drawCode(rect) {
      px(ctx, rect.x, rect.y, rect.w, rect.h, "#020705");
      px(ctx, rect.x + 6, rect.y + 5, rect.w - 12, rect.h - 10, "#04100a");
      ctx.strokeStyle = C.panelEdge; ctx.lineWidth = 1;
      ctx.strokeRect(rect.x + 6.5, rect.y + 5.5, rect.w - 13, rect.h - 11);
      ctx.save();
      ctx.beginPath(); ctx.rect(rect.x + 8, rect.y + 7, rect.w - 16, rect.h - 14); ctx.clip();
      const code = CODE[state.activeFile];
      const hl = (state.mode === "focus" && state.focus) ? state.focus.line : explorerHighlight();
      const lineH = 16;
      const visible = Math.floor((rect.h - 16) / lineH);
      let target = Math.max(0, hl - 1 - Math.floor(visible / 2));
      target = Math.min(target, Math.max(0, code.length - visible));
      // 平滑滚动：codeScroll 缓动逼近目标行（切换文件时直接吸附）
      if (state.codeScrollFile !== state.activeFile) { state.codeScroll = target; state.codeScrollFile = state.activeFile; }
      state.codeScroll += (target - state.codeScroll) * 0.22;
      if (Math.abs(target - state.codeScroll) < 0.03) state.codeScroll = target;
      const scroll = state.codeScroll, startI = Math.floor(scroll), subOff = (scroll - startI) * lineH;
      for (let i = -1; i <= visible && startI + i < code.length; i++) {
        const idx = startI + i;
        if (idx < 0) continue;
        const ln = idx + 1;
        const yy = rect.y + 10 + i * lineH - subOff;
        const hot = ln === hl;
        if (hot) {
          px(ctx, rect.x + 10, yy - 1, rect.w - 20, lineH, "rgba(0,255,102,0.10)");
          txt(ctx, "▸", rect.x + 12, yy, 11, C.green2, "left", "700");
        }
        const badge = codeLineBadge(state.activeFile, ln);
        if (badge && !hot) px(ctx, rect.x + 10, yy - 1, rect.w - 20, lineH, badge.bg);
        txt(ctx, String(ln).padStart(2, "0"), rect.x + 24, yy, 11, hot ? C.green2 : "#0a6a3c", "left", "700");
        const line = codeLineOf(state.activeFile, idx);
        const t = line.trim();
        const isComment = t.startsWith("#");
        const kw = t.startsWith("from") || t.startsWith("print") || t.startsWith("class") || t.startsWith("def");
        const COMMENT_COL = "#8fc4a4";   // 注释提亮，手机上也看得清
        const col = isComment ? COMMENT_COL : hot ? C.green2 : badge ? badge.color : kw ? C.greenDim : "#1aa85a";
        ctx.font = '400 11px "Microsoft YaHei","PingFang SC",monospace';
        // 给右侧徽章留位
        const badgeW = badge ? Math.min(78, ctx.measureText(badge.text).width + 12) + 12 : 0;
        const maxLW = rect.w - 48 - 12 - badgeW;
        const trunc = (s, w) => { if (ctx.measureText(s).width <= w) return s; while (s.length > 1 && ctx.measureText(s + "…").width > w) s = s.slice(0, -1); return s + "…"; };
        const ci = isComment ? -1 : (line || "").indexOf("#");
        if (ci > 0) {
          // 行内注释：代码用代码色、注释用亮色，并优先保住注释（手机上别被截掉）
          let codePart = line.slice(0, ci);
          const cmt = line.slice(ci);
          const codeBudget = Math.max(maxLW * 0.42, maxLW - ctx.measureText(cmt).width - 4);
          codePart = trunc(codePart, codeBudget);
          const cw = ctx.measureText(codePart).width;
          txt(ctx, codePart, rect.x + 48, yy, 11, col, "left");
          txt(ctx, trunc(cmt, maxLW - cw - 4), rect.x + 48 + cw + 4, yy, 11, COMMENT_COL, "left");
        } else {
          txt(ctx, trunc(line || " ", maxLW), rect.x + 48, yy, 11, col, "left");
        }
        if (badge) {
          const bw = Math.min(78, ctx.measureText(badge.text).width + 12);
          const bx = rect.x + rect.w - bw - 16;
          px(ctx, bx, yy + 1, bw, 13, badge.bg);
          ctx.strokeStyle = badge.color; ctx.lineWidth = 1; ctx.strokeRect(bx + 0.5, yy + 1.5, bw - 1, 12);
          txt(ctx, badge.text, bx + bw / 2, yy + 3, 9, badge.color, "center", "700");
        }
      }
      drawCodeTrace(rect);
      // 收束态：压暗聚焦行以外的代码
      if (state.mode === "focus" && state.focus) {
        const hotY = rect.y + 10 + (hl - 1 - scroll) * lineH;
        ctx.fillStyle = "rgba(2,7,5,0.6)";
        ctx.fillRect(rect.x + 8, rect.y + 7, rect.w - 16, Math.max(0, hotY - rect.y - 8));
        const belowY = hotY + lineH - 1;
        ctx.fillRect(rect.x + 8, belowY, rect.w - 16, Math.max(0, rect.y + rect.h - 7 - belowY));
      }
      ctx.restore();
    }

    // 探索态：代码高亮跟着角色走到的房间联动（每个文件用 zones 声明“哪块区域 → 高亮哪行”）
    function explorerHighlight() {
      if (state.dlg) return state.dlg.steps[state.dlg.i].n;   // 对话进行中：高亮当前这句对应的代码行
      const f = state.activeFile, fp = FILES[f];
      if (fp && fp.zones) {
        const p = state.player, x = p.gx, y = p.gy;
        for (const z of fp.zones) {
          if (x >= z.x0 && x <= z.x1 && y >= z.y0 && y <= z.y1) return z.line;
        }
      }
      return fp ? fp.highlight : 1;
    }
    // 进房对话：bot 逐句念代码里的 bot_say，对应行高亮；sys 行用屏幕中央淡入淡出
    function checkDialogue(x, y) {
      if (state.dlg) return;
      const ds = FILES[state.activeFile] && FILES[state.activeFile].dialogues;
      if (!ds) return;
      for (const dd of ds) {
        if (state.dlgSeen.includes(dd.key)) continue;
        const z = dd.zone;
        if (x >= z.x0 && x <= z.x1 && y >= z.y0 && y <= z.y1) { startDlg(dd); return; }
      }
    }
    function startDlg(dd) { state.dlgSeen.push(dd.key); state.dlg = { steps: dd.steps, i: 0 }; showDlgStep(); }
    function showDlgStep() {
      const dlg = state.dlg; if (!dlg) return;
      const s = dlg.steps[dlg.i];
      if (s.sys) { state.sysMsg = s.t; state.bot.until = 0; }
      else { state.sysMsg = null; showBot(s.t, 99); }
      sfx.bot();
    }
    function advanceDlg() {
      const dlg = state.dlg; if (!dlg) return;
      dlg.i++;
      if (dlg.i >= dlg.steps.length) { state.dlg = null; state.sysMsg = null; if (state.bot) state.bot.until = state.t + 3; }
      else showDlgStep();
    }
    function codeLineBadge(file, ln) {
      if (file === "main.py" && ln === 19) return { text: "选路", color: C.cyan, bg: "rgba(0,185,199,0.08)" };
      if (file === "main.py" && ln === 24) return { text: "LOOP", color: C.amber, bg: "rgba(245,197,66,0.10)" };
      if (file === "main.py" && ln === 33) return state.mainBreak
        ? { text: "FIXED", color: C.green2, bg: "rgba(57,255,136,0.12)" }
        : { text: "该 break", color: C.red2, bg: "rgba(255,42,42,0.10)" };
      if (file === "main.py" && ln === 45) return { text: "列表", color: C.cyan, bg: "rgba(0,185,199,0.08)" };
      if (file === "bug_model.py" && ln === 11) return { text: hasEvidence("fixed_state") ? "EVIDENCE" : "STATE", color: hasEvidence("fixed_state") ? C.cyan : C.amber, bg: "rgba(0,185,199,0.10)" };
      if (file === "bug_model.py" && ln === 16) return { text: "真修复", color: C.green2, bg: "rgba(57,255,136,0.08)" };
      if (file === "backlog.py" && ln === 20) return { text: scannerGateOpen() ? "HIDDEN OPEN" : "LOCKED", color: scannerGateOpen() ? C.green2 : C.amber, bg: scannerGateOpen() ? "rgba(57,255,136,0.10)" : "rgba(245,197,66,0.10)" };
      if (file === "config.py" && ln === 7) return { text: hasEvidence("auto_append") ? "EVIDENCE" : "ON", color: hasEvidence("auto_append") ? C.cyan : C.red2, bg: "rgba(255,42,42,0.10)" };
      if (file === "config.py" && ln === 18) return { text: "安全", color: C.green2, bg: "rgba(57,255,136,0.08)" };
      if (file === "fixer.py" && ln === 19) return { text: "假修复", color: C.red2, bg: "rgba(255,42,42,0.10)" };
      if (file === "fixer.py" && ln === 24) return { text: "真修复", color: C.green2, bg: "rgba(57,255,136,0.10)" };
      if (file === "scanner.py" && ln === 16) return { text: "APPEND", color: C.red2, bg: "rgba(255,42,42,0.12)" };
      if (file === "verifier.py" && ln === 11) return (state.codeOverrides["verifier.py"] && state.codeOverrides["verifier.py"][10])
        ? { text: "已修", color: C.green2, bg: "rgba(57,255,136,0.12)" }
        : { text: "信字符串", color: C.amber, bg: "rgba(245,197,66,0.10)" };
      if (file === "verifier.py" && ln === 19) return { text: "真标准", color: C.green2, bg: "rgba(57,255,136,0.08)" };
      if (file === "runtime_guard.py" && ln === 16) return (state.codeOverrides["runtime_guard.py"] && state.codeOverrides["runtime_guard.py"][15])
        ? { text: "已修", color: C.green2, bg: "rgba(57,255,136,0.12)" }
        : { text: "MUTED", color: C.red2, bg: "rgba(255,42,42,0.10)" };
      if (file === "runtime_guard.py" && ln === 25) return { text: "记录", color: C.green2, bg: "rgba(57,255,136,0.08)" };
      return null;
    }

    function drawCodeTrace(rect) {
      if (!state.trace.length) return;
      const w = Math.min(rect.w - 34, 360);
      const h = Math.min(58, 18 + state.trace.slice(-3).length * 13);
      const x = rect.x + rect.w - w - 14;
      const y = rect.y + rect.h - h - 12;
      px(ctx, x, y, w, h, "rgba(1,8,5,0.86)");
      ctx.strokeStyle = "rgba(0,185,199,0.55)";
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
      txt(ctx, "TRACE", x + 8, y + 5, 9, C.cyan, "left", "700");
      const items = state.trace.slice(-3);
      for (let i = 0; i < items.length; i++) {
        txt(ctx, fitLine(items[i].text, w - 18, 9, "700"), x + 8, y + 18 + i * 13, 9, items[i].color || C.green2, "left", "700");
      }
    }

    function drawControls(rect) {
      px(ctx, rect.x, rect.y, rect.w, rect.h, C.bg);
      px(ctx, rect.x, rect.y, rect.w, 2, "#02100a");

      // 方向键
      const s = Math.min(46, Math.max(36, rect.h * 0.29)), gap = 6;
      const bx = 22, by = rect.y + (rect.h - s * 3 - gap * 2) / 2;
      padBtn(bx + s + gap, by, s, "▲", "up");
      padBtn(bx, by + s + gap, s, "◀", "left");
      padBtn(bx + s + gap, by + s + gap, s, "▼", "down");
      padBtn(bx + (s + gap) * 2, by + s + gap, s, "▶", "right");

      // 动作键（2x2），锚定在方向键右侧避免重叠
      const dpadRight = bx + s * 3 + gap * 2;
      const ag = 7, ah = 30;
      const aLeft = dpadRight + 16;
      const aw = Math.min(112, Math.max(72, (rect.w - aLeft - 14 - ag) / 2));
      const ax = rect.w - aw * 2 - ag - 14, ay = rect.y + 12;
      actBtn(ax, ay, aw, ah, "run()|看表面", "run");
      actBtn(ax + aw + ag, ay, aw, ah, "step_into()|进内部", "step");
      if (state.patchUnlocked) actBtn(ax, ay + ah + ag, aw, ah, "patch()|贴证据", "patch");
      if (state.rollbackUnlocked) actBtn(ax + aw + ag, ay + ah + ag, aw, ah, "rollback()|撤回", "rollback");
      const invY = ay + (ah + ag) * 2 + 2;
      txt(ctx, "</>  碎片 " + state.inventory.length + "/7", ax, invY, 11, C.green2, "left", "700");
      state.buttons.push({ x: ax, y: invY - 4, w: aw, h: 20, tap: () => openInv("view") });
      const hw = 46, hgap = 6;
      const hx2 = rect.w - hw - 14;          // 提示（最右）
      const hx1 = hx2 - hw - hgap;           // 纵览（提示左侧）
      btnBox(hx1, invY - 6, hw, 22, C.cyanDim, "#04100a");
      txt(ctx, "纵览", hx1 + hw / 2, invY - 1, 11, "#7fffc4", "center", "700");
      state.buttons.push({ x: hx1, y: invY - 6, w: hw, h: 22, tap: () => { state.peek.open = true; sfx.bot(); } });
      btnBox(hx2, invY - 6, hw, 22, state.guideMode === "off" ? C.greenDark : C.cyanDim, "#04100a");
      txt(ctx, "提示", hx2 + hw / 2, invY - 1, 11, state.guideMode === "off" ? C.greenDim : "#7fffc4", "center", "700");
      state.buttons.push({ x: hx2, y: invY - 6, w: hw, h: 22, tap: () => { state.help.open = true; } });
    }

    function padBtn(x, y, s, label, dir) {
      const locked = state.mode === "focus";
      const active = state.held === dir;
      btnBox(x, y, s, s, locked ? "#0c2a22" : (active ? C.green : C.cyanDim), active ? "#0a3322" : "#06130d");
      txt(ctx, label, x + s / 2, y + s / 2 - 9, 18, locked ? "#1d4a3c" : (active ? C.black : C.green2), "center", "900");
      state.buttons.push({
        x, y, w: s, h: s,
        down: () => {
          if (state.scene === "game" && state.mode === "focus") return;
          state.held = dir; state.queue = dir;
          if (state.scene === "game") tryStep(dir);
        },
        up: () => { if (state.held === dir) state.held = null; }
      });
    }
    function actBtn(x, y, w, h, label, key) {
      let line = C.greenDark, fill = "#05120c", col = C.green2, pulse = 0;
      if (state.mode === "focus" && state.focus) {
        const ks = focusKeyState(key);
        if (ks.locked) { line = C.amber; fill = "#241c06"; col = C.amber; }
        else if (ks.primary) { line = C.green; fill = "#0a3322"; pulse = 0.4 + 0.5 * Math.sin(state.t * 6); }
        else if (ks.enabled) { line = C.cyanDim; fill = "#07120d"; col = "#7fffc4"; }
        else { line = "#142018"; fill = "#070d0a"; col = "#2a4434"; }
      }
      btnBox(x, y, w, h, line, fill);
      if (pulse) { ctx.strokeStyle = `rgba(57,255,136,${pulse.toFixed(2)})`; ctx.lineWidth = 2; ctx.strokeRect(x + 2, y + 2, w - 4, h - 4); }
      const parts = label.split("|");
      if (parts.length > 1) {
        txt(ctx, fitLine(parts[0], w - 8, 10, "700"), x + w / 2, y + 5, 10, col, "center", "700");
        txt(ctx, fitLine(parts[1], w - 8, 10, "700"), x + w / 2, y + 17, 10, col, "center", "700");
      } else {
        txt(ctx, label, x + w / 2, y + h / 2 - 7, label.length > 9 ? 11 : 12, col, "center", "700");
      }
      state.buttons.push({ x, y, w, h, tap: () => onAction(key) });
    }
    function onAction(key) {
      if (state.mode === "focus") { doFocusAction(key); return; }
      if (key === "rollback") { doRollback(); return; }
      sfx.bot();
      if (key === "run") showBot(BOT_LINES.run);
      else if (key === "step") showBot(BOT_LINES.step);
      else if (key === "patch") showBot(state.patchUnlocked ? BOT_LINES.patch : "先捡到碎片，patch() 才会解锁。");
    }
    function showBot(msg, dur) { state.bot.msg = msg; state.bot.until = state.t + (dur || 5); }

    function fitLine(s, maxW, size, weight = "400") {
      ctx.font = `${weight} ${size}px "Microsoft YaHei","PingFang SC",monospace`;
      if (ctx.measureText(s).width <= maxW) return s;
      let out = s;
      while (out.length > 2 && ctx.measureText(out + "…").width > maxW) out = out.slice(0, -1);
      return out + "…";
    }
    function wrapLines(s, maxW, size) {
      ctx.font = `400 ${size}px "Microsoft YaHei","PingFang SC",monospace`;
      const lines = []; let line = "";
      for (const ch of s) {
        if (ch === "\n") { lines.push(line); line = ""; continue; }
        if (ctx.measureText(line + ch).width > maxW) { lines.push(line); line = ch; }
        else line += ch;
      }
      if (line) lines.push(line);
      return lines;
    }
    function drawBotDialog(rect) {
      if (state.t >= state.bot.until) return;
      const W = state.W;
      const bw = Math.min(W - 24, 360), bx = (W - bw) / 2;
      const size = 12, lineH = 15;
      const lines = wrapLines(state.bot.msg, bw - 58, size);
      const bh = Math.max(50, 30 + lines.length * lineH);
      const by = rect.y + rect.h - bh - 10;
      px(ctx, bx, by, bw, bh, "rgba(4,18,12,0.95)");
      ctx.strokeStyle = C.greenDim; ctx.lineWidth = 1.5; ctx.strokeRect(bx + 1, by + 1, bw - 2, bh - 2);
      drawSprite(A.bot, bx + 8, by + 11, 2);
      txt(ctx, "DebugBot", bx + 46, by + 9, 11, C.cyan, "left", "700");
      for (let i = 0; i < lines.length; i++) txt(ctx, lines[i], bx + 46, by + 25 + i * lineH, size, C.green2, "left");
      if (state.dlg) txt(ctx, "▸ 点击继续", bx + bw - 10, by + 9, 9, "rgba(0,185,199,0.75)", "right", "700");
    }

    function btnBox(x, y, w, h, line, fill) {
      px(ctx, x, y, w, h, fill);
      ctx.strokeStyle = line; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
      px(ctx, x + 3, y + 3, w - 6, 2, "rgba(255,255,255,0.05)");
    }
    function pixelButton(x, y, w, h, label, line, fill, onClick) {
      btnBox(x, y, w, h, line, fill);
      const th = Math.min(26, h * 0.5);
      blockTitleText(
        [{ s: label, fill: C.green2 }],
        x + w / 2,
        y + (h - th) / 2,
        th,
        { rows: 26, maxW: w - 36, coverage: 0.13, outline: "#04140c", shadow: { x: 1, y: 1, fill: "#001b10" } }
      );
      state.buttons.push({ x, y, w, h, tap: onClick });
    }

    // ================= 移动逻辑 =================
    function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
    function canMove(x, y) {
      const m = state.map;
      if (x < 0 || y < 0 || x >= m.w || y >= m.h) return false;
      const c = m.grid[y][x];
      return c !== "#" && c !== "D" && c !== "d";
    }
    function bugAt(x, y) {
      if (!state.map || !state.map.bugs) return null;
      let hit = null, best = 99;
      for (const b of state.map.bugs) {
        const p = bugPosition(b);
        const d = Math.hypot(p.x - x, p.y - y);
        if (d < best && d < (b.extra ? 0.82 : 0.68)) { best = d; hit = b; }
      }
      return hit;
    }
    function handleBugContact() {
      if (state.scene !== "game" || !state.map || state.mode === "focus") return;
      const b = bugAt(state.player.fx, state.player.fy) || bugAt(state.player.gx, state.player.gy);
      if (!b) return;
      if (state.t - (b.hitAt || -9) <= 1.15 || state.t - state.lastBugHitAt <= 0.6) return;
      b.hitAt = state.t;
      state.lastBugHitAt = state.t;
      if (state.hitBugs.includes(b.id)) {
        addFx("闪避边缘", C.amber);
        sfx.blocked();
        return;
      }
      state.hitBugs.push(b.id);
      state.bugHits += 1;
      state.streak = 0;
      raiseHeat(BUG_HIT_HEAT, "red bug");
      sfx.alarm();
      showBot(BOT_LINES.bugHit, 4);
    }
    const DELTA = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    function tryStep(dir) {
      const p = state.player;
      if (p.moving || state.mode === "focus") return;
      p.dir = dir;
      const m = state.map;
      const d = DELTA[dir];
      const nx = p.gx + d[0], ny = p.gy + d[1];
      const target = (m.grid[ny] || [])[nx];
      if (target === "D") {
        // 走到发光文件门 → step_into 进入对应文件，或触发 Boss
        const door = FILES[state.activeFile].door;
        if (state.activeFile === "main.py") {   // 列表房顶上的门：通关(remove 光/insert 到 0)才开
          if (state.npc && state.npc.win) { p.dir = dir; transitionToFile(door.to); }
          else { sfx.blocked(); showBot("门口还堵着。先 remove 清光所有 NPC，或 insert 把自己排到下标 0。", 5); }
          return;
        }
        if (door && door.boss) { p.dir = dir; enterBoss(door.boss); }
        else if (door && door.locked) { sfx.blocked(); showBot(BOT_LINES.doorLocked); }
        else if (door) transitionToFile(door.to);
        else sfx.blocked();
        return;
      }
      if (target === "W" && !state.mainBreak) {
        // while True 没补 break：循环又转一圈，把你弹回原点（补上 break 后 W 变成可走的通道，往上进列表房）
        sfx.blocked();
        state.rollbackUnlocked = true;
        addGameTime(0.2, "while 又转一圈"); raiseHeat(5, "while True 空转");
        const sp = state.map.spawn;
        p.gx = sp.x; p.gy = sp.y; p.fx = sp.x; p.fy = sp.y; p.moving = false; p.dir = "up";
        addFx("while True → 回到开头", C.amber);
        showBot("你又回到了原点。while True 不会自己停，要补一句 break 才跳得出去。", 6);
        return;
      }
      // 死路门（左房 elif / 右房另一端）：看着像门，其实打不开
      if (target === "d") {
        const dd = (FILES[state.activeFile].deadDoors || []).find(o => o.x === nx && o.y === ny);
        sfx.blocked(); state.rollbackUnlocked = true;
        if (dd && dd.kind === "origin") {
          if (!state.mainBreak) {
            const sp = state.map.spawn;
            p.gx = sp.x; p.gy = sp.y; p.fx = sp.x; p.fy = sp.y; p.moving = false; p.dir = "up";
            addFx("这门把你送回了原点", C.amber);
            showBot("这扇门看着像出口，走过去却把你送回了原点。真正的出路是给 while 补一句 break。", 6);
          } else showBot("这扇门是死的，打不开。补好 break 后，往上从循环出口（W）出去。", 5);
        } else {
          addGameTime(0.2, "白走一趟");
          addFx("死路 · 用 rollback 回头", C.amber);
          showBot("这门看着像通往下一个房间，其实是 elif Left 死路，啥也修不了。按 rollback() 回岔路口，改走右边。", 7);
        }
        return;
      }
      if (state.activeFile === "main.py" && npcBlocksTile(nx, ny)) {   // NPC 占着的下标格挡路
        sfx.blocked(); showBot("有个 NPC 占着这个下标，过不去。用 remove 把人删掉，或 insert 把自己排到下标 0。", 5); return;
      }
      if (canMove(nx, ny)) {
        if (state.npc && state.npc.preview != null) state.npc.preview = null;  // 一走动，insert 预览里让位的人就归位
        p.gx = nx; p.gy = ny; p.moving = true;
        state.lastMoveAt = state.t;
        sfx.step();
        handleBugContact();
        const pk = pickupAt(nx, ny);
        if (pk) collect(pk);
        handleTerminalContact(nx, ny);
        checkDialogue(nx, ny);          // 走进新房间 → 触发该房对话（bot 念代码、对应行高亮）
        const fp = focusAt(nx, ny);
        if (fp) enterFocus(fp);
        else if (!pk && !state.dlg) nearHints(nx, ny);
      } else {
        sfx.blocked();
      }
    }
    function nearHints(x, y) {
      const m = state.map;
      const door = FILES[state.activeFile].door;
      for (const [dx, dy] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
        const c = (m.grid[y + dy] || [])[x + dx];
        if (c === "D" && state.t > state.bot.until) showBot(door && door.locked ? BOT_LINES.doorLocked : BOT_LINES.door);
        if (c === "W" && state.t > state.bot.until) showBot(state.mainBreak ? BOT_LINES.loopBreak : BOT_LINES.whileRoom);
      }
    }

    // 列表房 NPC 的显示位置朝目标下标格缓动（remove/insert 时人会“走”过去，下标变化看得见）
    function updateNpc(dt) {
      const n = state.npc;
      if (!n || state.activeFile !== "main.py") return;
      const slots = FILES["main.py"].npc.slots;
      if (!n.pos) { n.pos = {}; n.list.forEach((id, idx) => { const s = slots[idx]; n.pos[id] = { x: s.x, y: s.y }; }); }
      const k = Math.min(1, dt * 9);
      n.list.forEach((id, idx) => {
        const s = npcTargetSlot(n, idx);
        if (!n.pos[id]) n.pos[id] = { x: s.x, y: s.y };
        n.pos[id].x += (s.x - n.pos[id].x) * k;
        n.pos[id].y += (s.y - n.pos[id].y) * k;
      });
    }
    function updatePlayer(dt) {
      const p = state.player;
      if (p.moving) {
        const speed = 7.5; // 格/秒
        p.fx += (p.gx - p.fx) * Math.min(1, speed * dt);
        p.fy += (p.gy - p.fy) * Math.min(1, speed * dt);
        p.anim += dt;
        p.frame = Math.floor(p.anim * 8) % 2;
        if (Math.abs(p.gx - p.fx) < 0.04 && Math.abs(p.gy - p.fy) < 0.04) {
          p.fx = p.gx; p.fy = p.gy; p.moving = false; p.anim = 0; p.frame = 0;
          handleBugContact();
          if (state.held) tryStep(state.held); // 连续行走
        }
      } else {
        handleBugContact();
      }
    }
    function updateFx(dt) {
      for (let i = state.fx.length - 1; i >= 0; i--) {
        state.fx[i].t += dt;
        if (state.fx[i].t > 1.3) state.fx.splice(i, 1);
      }
    }

    // ================= 主循环 =================
    function loop(now) {
      const dt = Math.min(0.05, (now - (state.last || now)) / 1000);
      state.last = now; state.t += dt;
      state.titleT = (Math.sin(now / 420) + 1) / 2;
      if (state.scene === "intro" && state.introPhase === "vortex") state.introT += dt;
      if (state.scene === "file_transition") {
        state.ftT += dt;
        if (state.ftT >= 0.45 && !state.ftLoaded) { loadFile(state.ftTo); state.ftLoaded = true; }
        if (state.ftT >= 0.9) { state.scene = "game"; saveCheckpoint(); showBot(FILES[state.activeFile].intro, 5); checkMeltdown(); }
      }
      if (state.scene === "game") { updatePassiveHeat(dt); updatePlayer(dt); updateNpc(dt); updateFx(dt); }
      if (state.scene === "hidden_corridor") updateCorridor(dt);
      if (state.scene === "hidden_boss") { updateBoss(dt); updateFx(dt); }
      if (state.scene === "heat_story") {
        state.heatStoryT += dt;
        if (state.heatStoryT >= 4.2) enterBoss("cpu", "heat");
      }
      state.buttons = [];
      ctx.clearRect(0, 0, state.W, state.H);
      if (state.scene === "title") drawTitle();
      else if (state.scene === "intro") drawIntro();
      else if (state.scene === "file_transition") drawFileTransition();
      else if (state.scene === "ending") drawEnding();
      else if (state.scene === "heat_story") drawHeatStory();
      else if (state.scene === "hidden_corridor") drawCorridor();
      else if (state.scene === "hidden_boss") drawBoss();
      else drawGame();
      requestAnimationFrame(loop);
    }

    // ================= 输入 =================
    function evtPos(e) {
      const r = canvas.getBoundingClientRect();
      const pt = e.touches ? e.touches[0] : e;
      return { x: pt.clientX - r.left, y: pt.clientY - r.top };
    }
    function hit(x, y) {
      for (let i = state.buttons.length - 1; i >= 0; i--) {
        const b = state.buttons[i];
        if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
      }
      return null;
    }
    function onDown(e) {
      e.preventDefault();
      if (state.scene === "intro") { introToVortex(); return; }
      if (state.scene === "file_transition") return;
      if (state.scene === "heat_story") {
        if (state.heatStoryT < 2.0) state.heatStoryT = 2.0;
        else enterBoss("cpu", "heat");
        return;
      }
      if (state.scene === "hidden_corridor") {
        if (state.corridor.revealed) enterBoss(); else state.corridor.t = 3;
        return;
      }
      // 进房对话进行中：点一下推进下一句（不误触地图/方向键）
      if (state.scene === "game" && state.dlg && !state.inv.open && !state.quiz.open && !state.peek.open && !state.npcPick.open && !state.help.open) { advanceDlg(); return; }
      const p = evtPos(e), b = hit(p.x, p.y);
      if (!b) return;
      if (b.down) b.down();
      if (b.tap) b.tap();
    }
    function onUp(e) {
      e.preventDefault();
      for (const b of state.buttons) if (b.up) b.up();
    }
    function onKey(e) {
      const map = { ArrowUp: "up", w: "up", W: "up", ArrowDown: "down", s: "down", S: "down", ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right" };
      const dir = map[e.key];
      if (state.scene === "game" && state.dlg) { e.preventDefault(); advanceDlg(); return; }   // 对话中：任意键推进
      if (dir && state.scene === "game" && state.mode !== "focus") { e.preventDefault(); state.held = dir; tryStep(dir); }
      else if ((e.key === "Enter" || e.key === " ")) {
        if (state.scene === "title") { e.preventDefault(); beginIntro(); }
        else if (state.scene === "intro") introToVortex();
        else if (state.scene === "heat_story") {
          if (state.heatStoryT < 2.0) state.heatStoryT = 2.0;
          else enterBoss("cpu", "heat");
        }
      }
    }
    function onKeyUp(e) {
      const map = { ArrowUp: "up", w: "up", W: "up", ArrowDown: "down", s: "down", S: "down", ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right" };
      const dir = map[e.key];
      if (dir && state.held === dir) state.held = null;
    }

    function init() {
      try {
        if (!ctx) throw new Error("no canvas");
        buildAssets();
        loadProgress();
        resize();
        loadFile("main.py");
        window.addEventListener("resize", resize);
        window.addEventListener("keydown", onKey);
        window.addEventListener("keyup", onKeyUp);
        canvas.addEventListener("pointerdown", onDown);
        canvas.addEventListener("pointerup", onUp);
        canvas.addEventListener("pointercancel", onUp);
        canvas.addEventListener("pointerleave", onUp);
        requestAnimationFrame(loop);
      } catch (e) { showFatal(); }
    }
    window.addEventListener("error", showFatal);
    window.addEventListener("unhandledrejection", showFatal);
    init();
  })();
  </script>
</body>
</html>
