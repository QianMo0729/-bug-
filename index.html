    function parseMap(raw, name) {
      const W = 16;
      const grid = raw.map((row, y) => {
        const chars = row.padEnd(W, ".").slice(0, W).split("");
        if (y === 0 || y === raw.length - 1) return chars.map(() => "#");
        chars[0] = "#"; chars[W - 1] = "#";
        return chars;
      });
      const H = grid.length;
      let spawn = { x: 7, y: H - 4 }, bot = { x: 7, y: H - 6 };
      const bugs = [];
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const ch = grid[y][x];
        if (ch === "P") { spawn = { x, y }; grid[y][x] = "."; }
        else if (ch === "B") { bot = { x, y }; grid[y][x] = "."; }
        else if (ch === "b") { bugs.push(makeBugPatrol(name, bugs.length, x, y)); grid[y][x] = "."; }
      }
      const extras = EXTRA_BUGS[name] || [];
      for (const p of extras) bugs.push(makeBugPatrol(name, bugs.length, p.x, p.y, true));
      return { grid, w: W, h: H, spawn, botPos: bot, bugs };
    }
    function makeBugPatrol(file, idx, x, y, extra) {
      const modes = ["h", "v", "loop"];
      const mode = modes[(idx + file.length) % modes.length];
      return {
        id: file + ":" + idx + ":" + x + ":" + y,
        x, y, homeX: x, homeY: y,
        patrol: mode,
        amp: extra ? 0.92 : 0.72,
        speed: 0.7 + ((idx + file.length) % 4) * 0.18,
        phase: idx * 1.7 + file.length * 0.31,
        t: idx * 0.73,
        extra: !!extra
      };
    }
    const mapCache = {};
    function getMap(name) {
      if (!mapCache[name]) mapCache[name] = parseMap(MAPS[name], name);
      return mapCache[name];
    }

    function px(g, x, y, w, h, color) { g.fillStyle = color; g.fillRect(x, y, w, h); }
    function txt(g, s, x, y, size, color, align = "left", weight = "400") {
      g.fillStyle = color;
      g.font = `${weight} ${size}px "Microsoft YaHei","PingFang SC",monospace`;
      g.textAlign = align; g.textBaseline = "top";
      g.fillText(s, x, y);
    }

    // 像素字体：把文字画进低分辨率离屏 canvas 再最近邻放大，得到封面那种方块像素字
    let _pc = null, _pg = null;
    function pixelText(segments, cx, top, finalSize, opts = {}) {
      const weight = opts.weight || "900";
      const ps = opts.ps || 3;
      const outline = opts.outline || "#070b09";
      const outlineWidth = opts.outlineWidth || 1;
      const shadow = opts.shadow || null;
      const shadowX = shadow ? (shadow.x || 0) : 0;
      const shadowY = shadow ? (shadow.y || 0) : 0;
      const fontOf = sz => `${weight} ${sz}px "Microsoft YaHei","PingFang SC",monospace`;
      if (!_pc) { const m = makeCanvas(8, 8); _pc = m.c; _pg = m.g; }
      const g = _pg;
      let low = Math.max(7, Math.round(finalSize / ps));
      const measure = sz => { g.font = fontOf(sz); return segments.reduce((a, s) => a + g.measureText(s.s).width, 0); };
      let w = measure(low);
      if (opts.maxW) while (w * ps > opts.maxW && low > 7) { low--; w = measure(low); }
      const pad = 3 + outlineWidth + Math.ceil(Math.max(Math.abs(shadowX), Math.abs(shadowY)));
      const cw = Math.ceil(w) + pad * 2, ch = Math.ceil(low * 1.22) + pad * 2;
      _pc.width = cw; _pc.height = ch;
      g.imageSmoothingEnabled = false;
      g.font = fontOf(low); g.textBaseline = "top"; g.textAlign = "left";
      if (shadow) {
        g.fillStyle = shadow.fill || "rgba(0,0,0,0.7)";
        let x = pad;
        for (const s of segments) { g.fillText(s.s, x + shadowX, pad + shadowY); x += g.measureText(s.s).width; }
      }
      // 低分辨率描边，放大后得到厚重的像素字边缘
      g.fillStyle = outline;
      for (let dx = -outlineWidth; dx <= outlineWidth; dx++) for (let dy = -outlineWidth; dy <= outlineWidth; dy++) {
        if (!dx && !dy) continue;
        if (Math.abs(dx) + Math.abs(dy) > outlineWidth + 1) continue;
        let x = pad;
        for (const s of segments) { g.fillText(s.s, x + dx, pad + dy); x += g.measureText(s.s).width; }
      }
      // 彩色填充
      let x = pad;
      for (const s of segments) { g.fillStyle = s.fill; g.fillText(s.s, x, pad); x += g.measureText(s.s).width; }
      ctx.imageSmoothingEnabled = false;
      const dw = cw * ps, dh = ch * ps;
      const dx0 = opts.align === "left" ? cx : cx - dw / 2;
      ctx.drawImage(_pc, Math.round(dx0), Math.round(top), dw, dh);
      ctx.imageSmoothingEnabled = false;
      return dh;
    }

    function titleText(segments, cx, top, finalSize, opts = {}) {
      let size = Math.round(finalSize);
      const weight = opts.weight || "900";
      const fontOf = sz => `${weight} ${sz}px "Microsoft YaHei","PingFang SC","Segoe UI",sans-serif`;
      const measure = sz => {
        ctx.font = fontOf(sz);
        return segments.reduce((a, s) => a + ctx.measureText(s.s).width, 0);
      };
      let width = measure(size);
      if (opts.maxW) while (width > opts.maxW && size > 18) { size--; width = measure(size); }
      const shadow = opts.shadow || null;
      let x = cx - width / 2;

      ctx.save();
      ctx.font = fontOf(size);
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.lineJoin = "miter";
      ctx.miterLimit = 2;
      if (shadow) {
        ctx.fillStyle = shadow.fill || "#00191b";
        let sx = x;
        for (const seg of segments) {
          ctx.fillText(seg.s, sx + (shadow.x || 0), top + (shadow.y || 0));
          sx += ctx.measureText(seg.s).width;
        }
      }
      ctx.strokeStyle = opts.outline || "#020302";
      ctx.lineWidth = opts.lineWidth || Math.max(4, size * 0.12);
      let ox = x;
      for (const seg of segments) {
        ctx.strokeText(seg.s, ox, top);
        ox += ctx.measureText(seg.s).width;
      }
      let fx = x;
      for (const seg of segments) {
        ctx.fillStyle = seg.fill;
        ctx.fillText(seg.s, fx, top);
        fx += ctx.measureText(seg.s).width;
      }
      ctx.restore();
      return Math.round(size * 1.12);
    }

    let _btc = null, _btg = null;
    let _brc = null, _brg = null;
    const blockTextCache = new Map();
    function blockTitleText(segments, cx, top, targetH, opts = {}) {
      const rows = opts.rows || 20;
      const scale = opts.scale || Math.max(1, targetH / rows);
      const coverage = opts.coverage == null ? 0.14 : opts.coverage;
      const key = segments.map(s => `${s.s}:${s.fill}`).join("|") + `:${rows}:${opts.weight || "900"}:${coverage}`;
      const data = blockTextCache.get(key) || buildBlockTitleData(segments, rows, opts.weight || "900", { coverage });
      blockTextCache.set(key, data);
      const fitScale = opts.maxW && data.w * scale > opts.maxW ? opts.maxW / data.w : scale;
      const outlineCells = opts.outlineCells == null ? 1 : opts.outlineCells;
      const shadow = opts.shadow === false ? null : (opts.shadow || { x: fitScale, y: fitScale, fill: "#00191b" });
      const shadowCellsX = shadow ? Math.max(1, Math.round((shadow.x || fitScale) / fitScale)) : 0;
      const shadowCellsY = shadow ? Math.max(1, Math.round((shadow.y || fitScale) / fitScale)) : 0;
      const pad = outlineCells + Math.max(shadowCellsX, shadowCellsY) + 1;
      const sw = data.w + pad * 2, sh = data.h + pad * 2;
      if (!_brc) { const m = makeCanvas(8, 8); _brc = m.c; _brg = m.g; }
      _brc.width = sw; _brc.height = sh;
      _brg.imageSmoothingEnabled = false;
      _brg.clearRect(0, 0, sw, sh);
      if (shadow) {
        _brg.fillStyle = shadow.fill;
        for (const p of data.cells) _brg.fillRect(pad + p.x + shadowCellsX, pad + p.y + shadowCellsY, 1, 1);
      }
      _brg.fillStyle = opts.outline || "#020302";
      for (const p of data.cells) {
        for (let dx = -outlineCells; dx <= outlineCells; dx++) for (let dy = -outlineCells; dy <= outlineCells; dy++) {
          if (!dx && !dy) continue;
          if (Math.abs(dx) + Math.abs(dy) > outlineCells) continue;
          _brg.fillRect(pad + p.x + dx, pad + p.y + dy, 1, 1);
        }
      }
      for (const p of data.cells) {
        _brg.fillStyle = p.fill;
        _brg.fillRect(pad + p.x, pad + p.y, 1, 1);
      }
      const dw = Math.round(sw * fitScale), dh = Math.round(sh * fitScale);
      const dx0 = Math.round(cx - (data.w * fitScale) / 2 - pad * fitScale);
      const dy0 = Math.round(top - pad * fitScale);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(_brc, dx0, dy0, dw, dh);
      ctx.imageSmoothingEnabled = false;
      return data.h * fitScale;
    }

    function buildBlockTitleData(segments, rows, weight, opts = {}) {
      const srcSize = 180, pad = 32;
      const coverage = opts.coverage == null ? 0.14 : opts.coverage;
      if (!_btc) { const m = makeCanvas(8, 8); _btc = m.c; _btg = m.g; }
      const g = _btg;
      const font = `${weight} ${srcSize}px "Microsoft YaHei","PingFang SC","Segoe UI",sans-serif`;
      g.font = font;
      const widths = segments.map(s => g.measureText(s.s).width);
      const totalW = widths.reduce((a, b) => a + b, 0);
      const sw = Math.ceil(totalW + pad * 2), sh = Math.ceil(srcSize * 1.28 + pad * 2);
      _btc.width = sw; _btc.height = sh;
      g.imageSmoothingEnabled = false;
      g.clearRect(0, 0, sw, sh);
      g.font = font;
      g.textBaseline = "top";
      g.textAlign = "left";
      g.fillStyle = "#fff";
      let tx = pad;
      const ranges = [];
      for (let i = 0; i < segments.length; i++) {
        ranges.push({ x0: tx, x1: tx + widths[i], fill: segments[i].fill });
        g.fillText(segments[i].s, tx, pad);
        tx += widths[i];
      }
      const img = g.getImageData(0, 0, sw, sh).data;
      let minX = sw, minY = sh, maxX = 0, maxY = 0;
      for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
        if (img[(y * sw + x) * 4 + 3] > 18) {
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
      minX = Math.max(0, minX - 2); minY = Math.max(0, minY - 2);
      maxX = Math.min(sw - 1, maxX + 2); maxY = Math.min(sh - 1, maxY + 2);
      const bw = maxX - minX + 1, bh = maxY - minY + 1;
      const cols = Math.max(1, Math.ceil((bw / bh) * rows));
      const cells = [];
      for (let gy = 0; gy < rows; gy++) for (let gx = 0; gx < cols; gx++) {
        const x1 = Math.floor(minX + gx * bw / cols);
        const x2 = Math.ceil(minX + (gx + 1) * bw / cols);
        const y1 = Math.floor(minY + gy * bh / rows);
        const y2 = Math.ceil(minY + (gy + 1) * bh / rows);
        let hits = 0, total = 0, peak = 0;
        for (let sy = y1; sy < y2; sy++) for (let sx = x1; sx < x2; sx++) {
          const a = img[(sy * sw + sx) * 4 + 3];
          total++; if (a > 60) hits++; if (a > peak) peak = a;
        }
        if (peak > 120 && hits / Math.max(1, total) > coverage) {
          const mid = minX + (gx + 0.5) * bw / cols;
          const seg = ranges.find(r => mid >= r.x0 && mid <= r.x1) || ranges[ranges.length - 1];
          cells.push({ x: gx, y: gy, fill: seg.fill });
        }
      }
      return { w: cols, h: rows, cells };
    }

    // 颜色明暗：amt>0 提亮，amt<0 压暗
    function shade(hex, amt) {
      const n = parseInt(hex.slice(1), 16);
      let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      const f = v => Math.max(0, Math.min(255, Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt))));
      return "#" + ((1 << 24) + (f(r) << 16) + (f(g) << 8) + f(b)).toString(16).slice(1);
    }

    // 列表房 NPC：跟主角（兜帽客）明显不同——护目机器人，按编号上色，胸口留号码牌

    function buildNpc(id, frame) {
      const { c, g } = makeCanvas(16, 20);
      const body = NPC_COLORS[id % NPC_COLORS.length];
      const bodyDark = shade(body, -0.45), bodyLite = shade(body, 0.3);
      const fa = frame === 0 ? 0 : 1, fb = frame === 0 ? 1 : 0;
      px(g, 8, 0, 1, 2, "#0c1a18"); px(g, 7, 0, 2, 1, bodyLite);   // 天线
      px(g, 4, 2, 8, 6, "#1b2a2c"); px(g, 5, 2, 6, 1, "#2a4a4c");  // 头壳（方盒，非兜帽）
      px(g, 4, 4, 8, 3, "#0f3b3a");                                 // 护目镜带
      px(g, 5, 5, 2, 1, "#39ffe0"); px(g, 9, 5, 2, 1, "#39ffe0");   // 双眼发光
      px(g, 3, 8, 10, 7, body);                                     // 工服
      px(g, 3, 8, 2, 7, bodyDark); px(g, 11, 8, 2, 7, bodyDark);    // 两侧阴影
      px(g, 4, 8, 8, 1, bodyLite);                                  // 肩高光
      px(g, 5, 9, 6, 5, "#0c1a18");                                 // 胸口号码牌底（号码在外面画）

      px(g, 5, 15, 3, 3 + fa, "#16201f"); px(g, 9, 15, 3, 3 + fb, "#16201f");  // 腿
      px(g, 4, 17 + fa, 4, 1, "#070b09"); px(g, 9, 17 + fb, 4, 1, "#070b09");  // 脚
      return c;
    }

    function drawSprite(sprite, x, y, scale) {
      ctx.drawImage(sprite, Math.round(x), Math.round(y), Math.round(sprite.width * scale), Math.round(sprite.height * scale));

    // ================= 画面布局 / DPR =================
    let scanPattern = null;
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      const W = Math.max(320, Math.floor(window.innerWidth));
      const H = Math.max(480, Math.floor(window.innerHeight));
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = false;
      state.W = W; state.H = H; state.dpr = dpr;
      if (!scanPattern) {
        const { c, g } = makeCanvas(2, 3);
        px(g, 0, 0, 2, 1, "rgba(0,0,0,0.22)");
        scanPattern = ctx.createPattern(c, "repeat");
      }
    }

    // ================= 音效 =================
    let audioCtx = null;
    function tone(freq, dur, type = "square", vol = 0.04, delay = 0) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = audioCtx || new AC();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const t0 = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(vol, t0);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t0); osc.stop(t0 + dur);
      } catch (e) {}
    }
    const sfx = {
      step() { tone(150 + (state.player.frame ? 28 : 0), 0.04, "square", 0.02); },
      blocked() { tone(80, 0.05, "sawtooth", 0.02); },
      start() { tone(330, 0.07, "square", 0.05); tone(520, 0.1, "square", 0.04, 0.07); },
      vortex() { tone(220, 0.5, "sawtooth", 0.05); tone(110, 0.6, "sine", 0.05, 0.05); },
      enter() { tone(180, 0.18, "sine", 0.05); tone(360, 0.14, "square", 0.04, 0.05); },
      bot() { tone(620, 0.05, "square", 0.03); tone(720, 0.05, "square", 0.025, 0.05); },
      boss() { tone(70, 0.7, "sawtooth", 0.05); tone(104, 0.7, "square", 0.03, 0.02); },
      alarm() { tone(880, 0.12, "square", 0.045); tone(660, 0.12, "square", 0.04, 0.13); },
      shutdown() { tone(420, 0.5, "sine", 0.05); tone(150, 0.7, "sine", 0.05, 0.18); }
    };

    // 暗黑办公室：远景工位（复用）+ 前景程序员背影
    function drawOffice(x, y, w, h) {
      px(ctx, x, y, w, h, "#04080a");
      // 背景光晕
      const grad = ctx.createRadialGradient(w * 0.5, y + h * 0.32, 10, w * 0.5, y + h * 0.32, w * 0.7);
      grad.addColorStop(0, "rgba(0,80,60,0.22)");
      grad.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = grad; ctx.fillRect(x, y, w, h);

      // 远景工位三排，越远越小越暗（复用 drawCubicle）
      const rows = [
        { cy: y + h * 0.10, s: 0.7, n: 4, a: 0.45 },
        { cy: y + h * 0.20, s: 0.95, n: 3, a: 0.7 },
        { cy: y + h * 0.32, s: 1.25, n: 3, a: 1 }
      ];
      const lights = [C.greenDim, C.navy2, C.red, C.amber, C.green2];
      for (const r of rows) {
        const span = w / r.n;
        for (let i = 0; i < r.n; i++) {
          const cx = span * (i + 0.5);
          drawCubicle(cx, r.cy, r.s, lights[(i + Math.round(r.cy)) % lights.length], r.a);
        }
      }
      // 地面
      px(ctx, x, y + h * 0.46, w, h * 0.54, "#070b0a");
      px(ctx, x, y + h * 0.46, w, 2, "#0c1c14");

      // 前景：桌子 + 程序员背影 + 显示器 + 植物
      drawHeroDesk(w * 0.5, y + h * 0.52, h * 0.46, w);
    }

    function drawCubicle(cx, cy, s, light, alpha) {
      ctx.save(); ctx.globalAlpha = alpha;
      const dw = 34 * s, dh = 22 * s;
      px(ctx, cx - dw / 2, cy, dw, dh, "#0a1014");          // 隔间桌
      px(ctx, cx - dw / 2, cy, dw, 2 * s, "#142028");
      // 显示器
      px(ctx, cx - 9 * s, cy - 13 * s, 18 * s, 13 * s, "#0b1216");
      px(ctx, cx - 7 * s, cy - 11 * s, 14 * s, 9 * s, "#03110d");
      px(ctx, cx - 5 * s, cy - 9 * s, 7 * s, 1.4 * s, light);
      px(ctx, cx - 5 * s, cy - 6 * s, 9 * s, 1.4 * s, light);
      px(ctx, cx - 5 * s, cy - 3.5 * s, 5 * s, 1.4 * s, light);
      // 椅背 + 坐着的人剪影
      px(ctx, cx - 5 * s, cy + 2 * s, 10 * s, 8 * s, "#05090b");
      px(ctx, cx - 4 * s, cy - 2 * s, 8 * s, 6 * s, "#0a0d10");
      ctx.restore();
    }

    function drawHeroDesk(cx, baseY, sceneH, screenW) {
      const u = Math.max(3, Math.min(5.2, sceneH / 28)); // 像素单位
      const deskW = Math.min(screenW * 0.92, 78 * u);
      const deskY = baseY + 12 * u;

      // 显示器（发绿光，比人宽、比头高，正对我们）
      const mScale = u * 1.35;
      const mw = A.monitor.width * mScale, mh = A.monitor.height * mScale;
      const mx = cx - mw / 2, my = deskY - 2 * u - mh;
      // 屏幕绿光晕

      halo.addColorStop(0, "rgba(0,255,102,0.30)");
      halo.addColorStop(1, "rgba(0,255,102,0)");
      ctx.fillStyle = halo; ctx.fillRect(cx - mw, my - mh * 0.3, mw * 2, mh * 1.8);

      drawSprite(A.monitor, mx, my, mScale);
      ctx.restore();

      // 桌面（在显示器之前）
      px(ctx, cx - deskW / 2, deskY, deskW, 5 * u, "#3a2616");
      px(ctx, cx - deskW / 2, deskY, deskW, 1.4 * u, "#5a3a1f");
      px(ctx, cx - deskW / 2, deskY + 5 * u, deskW, 2 * u, "#1d130a");

      // 植物（桌左）
      drawPlant(cx - deskW * 0.40, deskY, u);
      // 键盘
      px(ctx, cx - 11 * u, deskY + 1.5 * u, 22 * u, 3 * u, "#10171c");
      for (let i = 0; i < 9; i++) px(ctx, cx - 10 * u + i * 2.4 * u, deskY + 2 * u, 1.4 * u, 1.4 * u, "#1d2a30");

    function drawPlant(cx, deskY, u) {

    function drawProgrammerBack(cx, deskY, u) {

      // 帽兜
      px(ctx, cx - 7 * u, bodyY - 1 * u, 14 * u, 3 * u, "#0e2c4d");

      px(ctx, cx - headW / 2 - u, bodyY - headH - u, headW + 2 * u, headH * 0.8, "#15131a");

    function drawTitleBanner(cx, y, w) {
      const bw = Math.min(430, w * 0.96), bh = titleBannerHeight(w), bx = cx - bw / 2;
      const u = bw / 390;

      node(bx + 34 * u, y + 30 * u); node(bx + 124 * u, y + 42 * u);

    function titlePlate(x, y, w, h, fill, stroke, lineW) {
      ctx.beginPath();
      ctx.moveTo(x + 22, y + 8);
      ctx.lineTo(x + w * 0.34, y);
      ctx.lineTo(x + w * 0.42, y + 12);
      ctx.lineTo(x + w * 0.58, y + 12);
      ctx.lineTo(x + w * 0.66, y);
      ctx.lineTo(x + w - 22, y + 8);
      ctx.lineTo(x + w - 6, y + h * 0.42);
      ctx.lineTo(x + w - 14, y + h - 10);
      ctx.lineTo(x + w * 0.68, y + h - 4);
      ctx.lineTo(x + w * 0.58, y + h - 14);
      ctx.lineTo(x + w * 0.42, y + h - 14);
      ctx.lineTo(x + w * 0.32, y + h - 4);
      ctx.lineTo(x + 14, y + h - 10);
      ctx.lineTo(x + 6, y + h * 0.42);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = stroke;
      ctx.lineWidth = lineW;
      ctx.stroke();
    }

    function corner(x, y, len, ydir) {
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len, y);
      ctx.moveTo(x, y); ctx.lineTo(x, y + 12 * ydir); ctx.stroke();

    // ================= 过场动画 =================
    function beginIntro() {
      state.scene = "intro"; state.introPhase = "dialogue"; state.introT = 0; state.introStep = 0;
      sfx.start();
    }
    function introToVortex() {
      if (state.introPhase !== "dialogue") return;
      if (state.introStep < INTRO_PAGES.length - 1) {
        state.introStep += 1;
        sfx.bot();
        return;
      }
      state.introPhase = "vortex"; state.introT = 0; sfx.vortex();
    }
    function drawIntro() {
      const W = state.W, H = state.H;
      px(ctx, 0, 0, W, H, C.black);
      if (state.introPhase === "dialogue") {
        const ot = officeTop(H);
        drawOffice(0, ot, W, H - ot);
        const page = INTRO_PAGES[state.introStep] || INTRO_PAGES[0];
        const bw = Math.min(330, W * 0.86), bx = (W - bw) / 2, by = H * 0.16;
        px(ctx, bx, by, bw, 96, "rgba(6,16,11,0.95)");
        ctx.strokeStyle = C.greenDim; ctx.lineWidth = 2; ctx.strokeRect(bx + 1, by + 1, bw - 2, 94);
        txt(ctx, "▌" + page.speaker, bx + 14, by + 12, 12, C.green2, "left", "700");
        for (let i = 0; i < page.lines.length; i++) {
          txt(ctx, page.lines[i], bx + 14, by + 38 + i * 24, 15, C.cream, "left", "700");
        }
        const blink = (Math.sin(state.t * 4) + 1) / 2;
        ctx.save(); ctx.globalAlpha = 0.45 + blink * 0.55;
        txt(ctx, "▶ 点击继续", W / 2, H - 64, 12, C.green2, "center", "700");
        ctx.restore();
      } else {
        const p = state.introT, k = Math.min(1, p / 1.0);
        ctx.save();
        ctx.translate(W / 2, H / 2);
        const rings = 26;
        for (let i = 0; i < rings; i++) {
          const a = (i / rings) * Math.PI * 2 + p * 5;
          const r = (1 - k) * (Math.max(W, H)) * (0.05 + i / rings);
          ctx.strokeStyle = i % 2 ? `rgba(0,255,102,${(0.5 * k).toFixed(2)})` : `rgba(0,185,199,${(0.4 * k).toFixed(2)})`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(Math.cos(a) * r * 0.15, Math.sin(a) * r * 0.15, r * 0.6, a, a + 1.6);
          ctx.stroke();
        }
        ctx.restore();
        ctx.fillStyle = `rgba(2,8,5,${(k * 0.85).toFixed(2)})`;
        ctx.fillRect(0, 0, W, H);
        txt(ctx, "step_into(main.py)", W / 2, H / 2 - 8, 14, C.green2, "center", "700");
        if (p >= 1.0) enterGame();
      }
    }

    // 加载/切换文件：地图、源码、面包屑随之更新，主角传送到入口
    function loadFile(name) {

      state.map = getMap(name);
      if (!state.openedFiles.includes(name)) state.openedFiles.push(name);
      const sp = state.map.spawn, p = state.player;
      p.gx = sp.x; p.gy = sp.y; p.fx = sp.x; p.fy = sp.y;
      p.moving = false; p.anim = 0; p.frame = 0; p.dir = "down";
      state.held = null;
      state.mode = "explore"; state.focus = null;
      if (name === "main.py" && !state.npc) state.npc = { list: [0, 1, 2, 3, 4, 5, 6], win: false, flash: 0, preview: null, pos: null };
      if (fresh && name !== "main.py") {
        gainInsight(12, "新文件");
        pushTrace("OPEN " + name, C.green2);
        progressHeat(PROGRESS_HEAT.file, "open " + name);
        addGameTime(0.3, "进入 " + name);
      }
    }
    function switchTab(name) {
      if (name === state.activeFile) return;
      loadFile(name);
      sfx.enter();
      showBot(FILES[name].intro, 4.5);

    function transitionToFile(name) {
      if (!name || !MAPS[name]) { showBot(BOT_LINES.doorLocked); return; }

      sfx.vortex();
    }

    // ---- 收束态 focus ----

    function addEvidence(key, label) {

    function scannerGateOpen() { return hasEvidence("fixed_state") && hasEvidence("auto_append") && hasRootShard(); }
    function hiddenGateMissing() {
      const missing = [];

    function openQuiz(fp) {
      if (!fp.quiz) return;

    }
    function closeQuiz() {

    }
    function pushCallStack(label) {
      if (!label) return;

    function doFocusAction(key) {

      if (key === "run") {

        } else if (!fp.action && !fp.patchable) {
          markFocusSolved(fp);
          gainInsight(10, "看懂分支");

        } else {

          showBot(BOT_LINES.runSkim, 4);

        return;
      }
      if (key === "rollback") { doRollback(); return; }
      if (key === "patch") {
        if (!fp.patchable) { sfx.blocked(); showBot("这一行不能打补丁，试试 step_into()。", 4); return; }
        if (state.inventory.length === 0) { sfx.blocked(); showBot("背包里还没有碎片，先去地图上捡发光的 </> 碎片。", 4); return; }
        openInv("pick"); return;
      }
      if (key === "step") {
        if (fp.action !== "step") { sfx.blocked(); return; }
        if (fp.locked) { sfx.blocked(); showBot(BOT_LINES.lockedDive, 4); return; }
        if (fp.hiddenGate && !scannerGateOpen()) {
          const missing = hiddenGateMissing();
          state.hiddenGateT = state.t + 2.2;
          state.streak = 0;
          pushTrace("LOCK scanner.py missing: " + missing.join(" / "), C.amber);
          addFx("隐藏入口未解密", C.amber);
          sfx.blocked();
          showBot("scanner.py 不是普通门。还缺：" + missing.join("、") + "。先回证据房补齐，再来 step_into()。", 7);
          return;
        }
        markFocusSolved(fp);
        gainInsight(fp.to === "scanner.py" ? 35 : 18, fp.to === "scanner.py" ? "隐藏调用" : "step_into");
        pushCallStack(fp.stack || fp.to);
        pushTrace("STEP " + state.activeFile + " -> " + (fp.stack || fp.to), C.green2);
        progressHeat(PROGRESS_HEAT.step, "step_into");
        if (fp.to === "scanner.py") { exitFocus(); enterCorridor(); return; }
        const to = fp.to; exitFocus(); transitionToFile(to); return;
      }
    }

    // ---- 碎片 / 补丁 / 技术债 / rollback ----
    function pickupKey(p) { return state.activeFile + ":" + p.x + ":" + p.y; }
    function pickupAt(x, y) {
      const ps = FILES[state.activeFile].pickups;
      if (!ps) return null;
      return ps.find(p => p.x === x && p.y === y && !state.pickedUp.includes(pickupKey(p))) || null;
    }
    function terminalKey(x, y) { return state.activeFile + ":" + x + ":" + y; }
    function terminalAt(x, y) {
      const c = state.map && state.map.grid[y] && state.map.grid[y][x];
      return c === "T" || c === "L" ? c : null;
    }
    function handleTerminalContact(x, y) {
      const type = terminalAt(x, y);
      if (!type) return;
      const key = terminalKey(x, y);
      if (state.terminalsSeen.includes(key)) return;
      state.terminalsSeen.push(key);
      if (type === "L") {
        state.hiddenGateT = state.t + 2.2;
        pushTrace("LOCK PANEL " + hiddenGateMissing().join(" / "), C.amber);
        addFx("锁台扫描", C.amber);
        showBot("锁台提示：隐藏入口不是门，是证据锁。需要状态证据、配置证据和根因碎片。", 6);
      } else {
        const trace = terminalTrace();
        pushTrace(trace, C.cyan);
        progressHeat(PROGRESS_HEAT.terminal, "trace");
        gainInsight(6, "trace");
        showBot("终端吐出一条 trace：" + trace, 5);
      }
    }
    function terminalTrace() {
      if (state.activeFile === "main.py") return "while True 不写 break 就停不下来";
      if (state.activeFile === "bug_model.py") return "BugReport.fixed starts False";
      if (state.activeFile === "backlog.py") return "scan() mutates list length";
      if (state.activeFile === "config.py") return "AUTO_APPEND controls scanner_policy()";
      if (state.activeFile === "fixer.py") return "quick_patch returns text only";
      if (state.activeFile === "verifier.py") return "verifier trusts patch string";
      if (state.activeFile === "runtime_guard.py") return "RuntimeError swallowed by pass";
      return "trace unavailable";
    }
    function collect(p) {
      state.pickedUp.push(pickupKey(p));
      state.inventory.push(p.frag);
      state.shards = Math.min(7, state.shards + 1);
      state.patchUnlocked = true;
      sfx.bot();
      addFx("拾取  " + p.frag, C.green2);
      pushTrace("PICKUP " + p.frag, C.green2);
      progressHeat(PROGRESS_HEAT.shard, "pickup");
      gainInsight(5, "线索");
      showBot("捡到碎片：" + p.frag + "。在收束态用 patch() 把它贴到代码行上。", 5);
    }
    function addFx(text, color) {
      state.fx.push({ text, color: color || C.green2, t: 0 });
      if (state.fx.length > 4) state.fx.shift();
    }
    function pushTrace(text, color) {
      state.trace.push({ text, color: color || C.green2, t: state.t });
      if (state.trace.length > 6) state.trace.shift();
    }
    function raiseHeat(amount, reason) {
      const before = state.cpuHeat;
      state.cpuHeat = Math.min(130, state.cpuHeat + amount);
      addFx("CPU +" + amount + "°C" + (reason ? " · " + reason : ""), state.cpuHeat >= HEAT_BOSS_THRESHOLD ? C.red2 : C.amber);
      if (!state.heatWarned && before < 60 && state.cpuHeat >= 60) {
        state.heatWarned = true;
        showBot("CPU 到危险区了。它会继续自己升温，红区会强制进入抢救战。", 5);
      }
      checkMeltdown();
    }
    function progressHeat(amount, reason) {
      if (state.heatBossTriggered || (state.scene !== "game" && state.scene !== "file_transition")) return;
      state.heatProgress += amount;
      const whole = Math.floor(state.heatProgress);
      if (whole <= 0) return;
      state.heatProgress -= whole;
      state.cpuHeat = Math.min(130, state.cpuHeat + whole);
      pushTrace("HEAT +" + whole + " " + reason, state.cpuHeat >= HEAT_BOSS_THRESHOLD ? C.red2 : C.amber);
      if (state.cpuHeat >= 68 && state.cpuHeat < HEAT_BOSS_THRESHOLD && !state.heatWarned) {
        state.heatWarned = true;
        showBot("CPU 正在随调试进度升温。不是地图入口，红区会强制抢救。", 5);
      }
      checkMeltdown();
    }
    function updatePassiveHeat(dt) {
      // 设定改变：温度/时间只随"进度"增加（见 progressHeat / addGameTime），不再随挂机时间空涨。
      // 这里只盯红线，不再被动加温。
      if (state.scene !== "game") return;
      checkMeltdown();
    }
    // 时间随"进度"增加（不随挂机时间流逝）；超过阈值后触发睡意 Boss（待接）
    function addGameTime(h, reason) {
      state.gameTime = Math.round((state.gameTime + h) * 10) / 10;
      addFx("时间 +" + h + "h" + (reason ? " · " + reason : ""), C.cyan);
      pushTrace("TIME +" + h + (reason ? " " + reason : ""), C.cyan);
    }
    function gainInsight(points, label) {
      state.insight = Math.min(999, state.insight + points);
      state.streak = Math.min(9, state.streak + 1);
      state.comboUntil = state.t + 1.2;
      addFx("+" + points + " IDEA" + (label ? " · " + label : ""), state.streak >= 3 ? C.amber : C.green2);
      if (state.streak >= 3) addFx("连击 x" + state.streak, C.amber);
    }
    function codeLineOf(file, idx) {
      const ov = state.codeOverrides[file];
      return (ov && ov[idx] != null) ? ov[idx] : CODE[file][idx];
    }
    function snapshot() {
      return {
        file: state.activeFile, gx: state.player.gx, gy: state.player.gy,
        techDebt: state.techDebt, cpuHeat: state.cpuHeat, shards: state.shards, gameTime: state.gameTime,
        heatDrift: state.heatDrift, heatProgress: state.heatProgress,
        insight: state.insight, streak: state.streak, bugHits: state.bugHits,
        heatBossTriggered: state.heatBossTriggered, heatWarned: state.heatWarned, lastBugHitAt: state.lastBugHitAt,
        hitBugs: state.hitBugs.slice(),
        inventory: state.inventory.slice(),
        pickedUp: state.pickedUp.slice(),
        mainBreak: state.mainBreak,
        openedFiles: state.openedFiles.slice(),
        focusSeen: state.focusSeen.slice(),
        solvedFocus: state.solvedFocus.slice(),
        lessonSeen: state.lessonSeen.slice(),
        quizAnswered: state.quizAnswered.slice(),
        callStack: state.callStack.slice(),
        evidence: state.evidence.slice(),
        trace: state.trace.slice(),
        terminalsSeen: state.terminalsSeen.slice(),
        hiddenGateT: state.hiddenGateT,
        patchGraceUsed: state.patchGraceUsed,
        patchUnlocked: state.patchUnlocked,
        rollbackUnlocked: state.rollbackUnlocked,
        guideMode: state.guideMode,
        overrides: JSON.parse(JSON.stringify(state.codeOverrides))
      };
    }
    function saveCheckpoint() { state.checkpoint = snapshot(); }
    function doRollback() {
      const cp = state.checkpoint;
      if (!cp) { sfx.bot(); showBot("还没有 checkpoint。进房间、打补丁前会自动存档。", 4); return; }
      state.openedFiles = cp.openedFiles.slice();
      loadFile(cp.file);
      const p = state.player;
      p.gx = cp.gx; p.gy = cp.gy; p.fx = cp.gx; p.fy = cp.gy;
      state.techDebt = cp.techDebt; state.cpuHeat = cp.cpuHeat; state.shards = cp.shards; state.gameTime = cp.gameTime || 0;
      state.heatDrift = cp.heatDrift; state.heatProgress = cp.heatProgress;
      state.insight = cp.insight; state.streak = cp.streak; state.bugHits = cp.bugHits;
      state.heatBossTriggered = cp.heatBossTriggered; state.heatWarned = cp.heatWarned; state.lastBugHitAt = cp.lastBugHitAt;
      state.hitBugs = cp.hitBugs.slice();
      state.inventory = cp.inventory.slice();
      state.pickedUp = cp.pickedUp.slice();
      state.mainBreak = !!cp.mainBreak;
      state.focusSeen = cp.focusSeen.slice();
      state.solvedFocus = cp.solvedFocus.slice();
      state.lessonSeen = cp.lessonSeen.slice();
      state.quizAnswered = cp.quizAnswered.slice();
      state.quiz = { open: false, key: "", fp: null, selected: -1, answered: false };
      state.compare = null;
      state.help = { open: false };
      state.evidence = cp.evidence.slice();
      state.trace = cp.trace.slice();
      state.terminalsSeen = cp.terminalsSeen.slice();
      state.hiddenGateT = cp.hiddenGateT;
      state.patchGraceUsed = cp.patchGraceUsed;
      state.patchUnlocked = cp.patchUnlocked;
      state.rollbackUnlocked = cp.rollbackUnlocked;
      state.guideMode = cp.guideMode;
      state.callStack = cp.callStack.slice();
      state.codeOverrides = JSON.parse(JSON.stringify(cp.overrides));
      state.checkpoint = null;
      sfx.enter();
      addFx("rollback() → checkpoint", C.cyan);
      if (state.activeFile === "main.py" && !state.mainBreak) {
        // 用 rollback 硬跳出死循环：代价很大；其实只要一块 break
        raiseHeat(12, "rollback 强行跳出循环");
        showBot("rollback 把你整个拽回开头，CPU 一下就窜上去了。其实只缺一块 break。", 6);
      } else {
        showBot("rollback() 读回了上一个存档点。真实调试器可没有后悔药。", 5);
      }
    }
    function applyPatch(frag) {
      const fp = state.focus;
      if (!fp) return;
      if (fp.npcConsole) { handleNpcOp(frag); return; }   // 列表房：append/insert/remove 操作 NPC 列表
      saveCheckpoint();
      const file = state.activeFile;
      if (!state.codeOverrides[file]) state.codeOverrides[file] = {};
      const spec = fp.patch;
      const isCorrect = spec && spec.correct && spec.correct.includes(frag);
      const consumeFrag = () => {
        const i = state.inventory.indexOf(frag);
        if (i >= 0) state.inventory.splice(i, 1);
        state.shards = Math.max(0, state.shards - 1);
      };
      // 特定碎片（如 continue）：把它当真"运行"，演出后果，但不消耗碎片，可反复试
      if (!isCorrect && spec && spec.altHints && spec.altHints[frag]) {
        sfx.blocked();
        closeInv();
        if (spec.altBounce) {
          // continue 会跳过本次循环剩下的部分、回到 while 开头 → 把你弹回出生点
          exitFocus();
          addGameTime(0.2, "continue 又转一圈");
          raiseHeat(3, "continue 空转");
          const sp = state.map.spawn, p = state.player;
          p.gx = sp.x; p.gy = sp.y; p.fx = sp.x; p.fy = sp.y; p.moving = false; p.dir = "up";
          addFx("continue → 回到循环开头", C.amber);
        } else {
          addFx("先别急", C.amber);
        }
        showBot(spec.altHints[frag], 7);
        return;
      }
      if (isCorrect) {
        consumeFrag();
        // 正确补丁：行变绿、不涨债务、可降温、解释卡
        state.codeOverrides[file][fp.line - 1] = spec.green;
        if (spec.unlockLoop) state.mainBreak = true; // break 补上，while 循环门打开
        if (spec.heatFix) state.cpuHeat = Math.max(30, state.cpuHeat + spec.heatFix);
        if (spec.compare) state.compare = spec.compare;
        markFocusSolved(fp);
        gainInsight(30, "真修复");
        progressHeat(PROGRESS_HEAT.fix, "patch");
        addFx("✓ 修复", C.green2);
        pushTrace("PATCH OK " + file + ":" + fp.line + " -> " + frag, C.green2);
        if (spec.heatFix) addFx("CPU " + spec.heatFix + "°C", C.green2);
        sfx.enter();
        closeInv(); exitFocus();
        showBot(spec.explain, 6);
      } else {
        if (!state.patchGraceUsed) {
          state.patchGraceUsed = true;
          state.rollbackUnlocked = true;
          state.streak = 0;
          addFx("教学保护：碎片返还", C.amber);
          pushTrace("PATCH TRIAL refunded: " + frag, C.amber);
          sfx.blocked();
          closeInv();
          showBot("这次不算技术债，也不消耗碎片。先看这行真正要验证什么，再试一次 patch()。", 6);
          return;
        }
        consumeFrag();
        state.rollbackUnlocked = true;
        // 错误 / 浅层补丁：注释化、涨债务、升温
        const indent = (CODE[file][fp.line - 1].match(/^\s*/) || [""])[0];
        state.codeOverrides[file][fp.line - 1] = indent + (frag.trim().startsWith("#") ? frag.trim() : "# " + frag.trim());
        state.techDebt += 1;
        addGameTime(0.5, "返工");
        state.streak = 0;
        addFx("+1 DEBT", C.red2);
        pushTrace("PATCH WRONG " + file + ":" + fp.line + " -> " + frag, C.red2);
        raiseHeat(8, "补丁反噬");
        sfx.blocked();
        closeInv(); exitFocus();
        showBot(spec ? "这不是对的碎片。" + BOT_LINES.patchShallow : BOT_LINES.patchShallow, 6);
      }
    }
    // ===== 列表房：操作 NPC 列表 =====
    // 每个下标对应房里一个固定站位（散布，不排队）；下标 0 永远是门口那格。
    function npcTargetSlot(n, idx) {
      const slots = FILES["main.py"].npc.slots;
      const shift = (n.preview != null && idx >= n.preview) ? 1 : 0;   // insert 预览：i 及之后的人往后让一位
      return slots[Math.min(idx + shift, slots.length - 1)];
    }
    function npcBlocksTile(nx, ny) {                 // NPC 当前占着的下标格挡路
      const n = state.npc; if (!n || n.win) return false;
      for (let idx = 0; idx < n.list.length; idx++) {
        const s = npcTargetSlot(n, idx);
        if (s.x === nx && s.y === ny) return true;
      }
      return false;
    }
    function teleportPlayer(x, y, dir) {             // 瞬移：插入/落点用
      const p = state.player;
      p.gx = x; p.gy = y; p.fx = x; p.fy = y; p.moving = false; p.dir = dir || p.dir;
    }
    function handleNpcOp(frag) {
      closeInv();
      const n = state.npc;
      if (!n || n.win) { exitFocus(); return; }
      n.preview = null;                               // 任何新操作前，先让队伍归位
      if (frag === "remove") {
        if (n.list.length === 0) { showBot("已经没人可删了。", 4); return; }
        const id = n.list.shift();          // 删掉门口（下标 0）那个，后面的人下标各往前挪一位
        n.flash = state.t + 0.5; sfx.step(); addFx("remove N" + id, C.amber);
        if (n.list.length === 0) npcWin("NPCs 全删光了，门口空出来——门通了！");
        else showBot("NPCs.remove('N" + id + "') 删掉了门口那个 N" + id + "，后面每个人的下标都往前挪一位。还剩 " + n.list.length + " 个。", 6);
      } else if (frag === "append") {
        const end = n.list.length;          // append 落到末尾（下标 = 当前长度）
        n.flash = state.t + 0.5; sfx.bot(); addFx("append → 下标 " + end, C.amber);

      const sp = 0.9;
      if (state.held === "left") state.arena.x -= sp * dt;
      else if (state.held === "right") state.arena.x += sp * dt;
      else if (state.held === "up") state.arena.y -= sp * dt;

      state.arena.x = clamp(state.arena.x, 0.06, 0.94);
      state.arena.y = clamp(state.arena.y, 0.3, 0.94);
      b.spawnT -= dt;

        b.spawnT = Math.max(0.3, 0.8 - state.techDebt * 0.05);
        const bx = 0.2 + Math.random() * 0.6;

      for (let i = b.bullets.length - 1; i >= 0; i--) {

        if (bl.y > 1.02 || bl.x < -0.05 || bl.x > 1.05) { b.bullets.splice(i, 1); continue; }

    function layout() {
      const W = state.W, H = state.H;
      const statusH = 30, tabsH = 34;
      const controlsH = Math.max(132, Math.min(168, H * 0.21));
      const codeH = Math.max(118, Math.min(176, H * 0.21));
      const mapH = H - statusH - tabsH - codeH - controlsH;
      return {
        map: { x: 0, y: 0, w: W, h: mapH },
        status: { x: 0, y: mapH, w: W, h: statusH },
        tabs: { x: 0, y: mapH + statusH, w: W, h: tabsH },
        code: { x: 0, y: mapH + statusH + tabsH, w: W, h: codeH },
        controls: { x: 0, y: H - controlsH, w: W, h: controlsH }
      };
    }

    function drawPeek() {

      px(ctx, 0, 0, W, H, "rgba(1,6,4,0.88)");

      px(ctx, bx, by, pw, ph, "#06140d");
      ctx.strokeStyle = C.cyan; ctx.lineWidth = 2; ctx.strokeRect(bx + 1, by + 1, pw - 2, ph - 2);
      const f = FILES[state.activeFile];
      const code = CODE[state.activeFile] || [];
      const cur = explorerHighlight();             // 你现在站的房间对应的代码行
      // 往上找最近的 def/class，作为当前段落起点 + 段名
      let secStart = 0, secName = "";
      for (let i = Math.min(cur - 1, code.length - 1); i >= 0; i--) {
        const tt = (code[i] || "").trim();
        if (tt.startsWith("def ") || tt.startsWith("class ")) {
          secStart = i; secName = tt.replace(/[:(].*$/, "").replace(/^def\s+|^class\s+/, ""); break;
        }

      txt(ctx, "纵览 · " + f.title, bx + 16, by + 12, 14, C.cyan, "left", "700");

      const codeTop = by + 52, botPad = 48, lineH = 18;
      const areaH = ph - 52 - botPad;
      const rows = Math.floor(areaH / lineH);
      let startIdx = Math.max(0, secStart - 1);
      startIdx = Math.min(startIdx, Math.max(0, code.length - rows));
      ctx.save(); ctx.beginPath(); ctx.rect(bx + 8, codeTop - 4, pw - 16, areaH + 8); ctx.clip();
      for (let r = 0; r < rows && startIdx + r < code.length; r++) {
        const idx = startIdx + r, ln = idx + 1, yy = codeTop + r * lineH;
        const raw = codeLineOf(state.activeFile, idx) || " ";
        const tt = raw.trim();
        const fromBottom = rows - 1 - r;
        ctx.globalAlpha = fromBottom < 4 ? Math.max(0.12, fromBottom / 4) : 1;   // 底部几行渐隐
        const isCur = ln === cur;
        const isDef = tt.startsWith("def ") || tt.startsWith("class ");

        const col = tt.startsWith("#") ? "#9fd0b0" : isCur ? C.green2 : isDef ? C.cyan : "#46d486";
        txt(ctx, fitLine(raw, pw - 56, 12), bx + 42, yy, 12, col, "left");
      }
      ctx.globalAlpha = 1; ctx.restore();
      const cw = 72, ch = 30, cx = bx + pw - cw - 14, cy = by + ph - ch - 10;
      btnBox(cx, cy, cw, ch, C.cyanDim, "#07120d");

      state.buttons.push({ x: cx, y: cy, w: cw, h: ch, tap: () => { state.peek.open = false; } });

    function drawMap(rect) {
      state.mapRect = rect;
      const tile = Math.max(26, Math.min(40, Math.floor(rect.w / 11)));
      state.tile = tile;
      const m = state.map;
      const worldPxW = m.w * tile, worldPxH = m.h * tile;
      const p = state.player;
      // 相机跟随：纵向让角色落在“干净视窗”中央——避开顶部(目标/概念/调用栈)和底部(DebugBot)的浮层
      const topInset = 100, botInset = 80;
      const bandCenter = topInset + Math.max(0, rect.h - topInset - botInset) / 2;
      let camX = p.fx * tile + tile / 2 - rect.w / 2;
      let camY = p.fy * tile + tile / 2 - bandCenter;
      camX = worldPxW <= rect.w ? (worldPxW - rect.w) / 2 : clamp(camX, 0, worldPxW - rect.w);
      // 允许相机越过地图上下边界：多出来的部分正好被上下浮层盖住，角色(和身边的门)因此始终可见，不会顶到墙就不动

    function doorTile() {
      const m = state.map;
      for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
        if (m.grid[y][x] === "D") return { x, y };

    function hasAnyFrag(names) {
      return names && names.some(n => state.inventory.includes(n));
    }
    function unpickedPickup(match) {
      const ps = FILES[state.activeFile].pickups || [];
      return ps.find(p => !state.pickedUp.includes(pickupKey(p)) && (!match || match.includes(p.frag))) || null;
    }
    function currentObjectiveTarget() {
      const file = state.activeFile;
      const f = FILES[file];
      if (!f) return null;
      if (file === "main.py" && state.mainBreak) return { x: 11, y: 1, label: "出口 →" };
      if (file === "backlog.py" && !hasAnyFrag(["# scan should be read-only", "return bugs"])) {
        const pk = unpickedPickup(["# scan should be read-only", "return bugs"]);
        if (pk) return { x: pk.x, y: pk.y, label: "先拿根因碎片" };
      }
      if (file === "runtime_guard.py" && !hasAnyFrag(["log(e)", "raise"])) {
        const pk = unpickedPickup(["log(e)", "raise"]);
        if (pk) return { x: pk.x, y: pk.y, label: "拿异常处理碎片" };
      }
      const fp = f.focus && f.focus.find(p => !focusSolved(p) && ((p.action === "step") || p.patchable || !state.focusSeen.includes(state.activeFile + ":" + p.line + ":" + p.label)));
      if (fp) return { x: fp.x, y: fp.y, label: fp.label };
      const pk = unpickedPickup();
      if (pk) return { x: pk.x, y: pk.y, label: "线索碎片" };
      const d = doorTile();
      if (d) {
        for (const [dx, dy] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
          const x = d.x + dx, y = d.y + dy;
          if (canMove(x, y)) return { x, y, label: FILES[file].door ? (FILES[file].door.label || FILES[file].door.to) : "文件门" };
        }
      }
      return null;
    }
    function routeTo(target) {
      if (!target) return [];
      const m = state.map, start = { x: state.player.gx, y: state.player.gy };
      const q = [start], prev = new Map([[start.x + "," + start.y, null]]);
      for (let qi = 0; qi < q.length; qi++) {
        const p = q[qi];
        if (p.x === target.x && p.y === target.y) break;
        for (const [dx, dy] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
          const nx = p.x + dx, ny = p.y + dy, key = nx + "," + ny;
          if (nx < 0 || ny < 0 || nx >= m.w || ny >= m.h || prev.has(key)) continue;
          if (!canMove(nx, ny)) continue;
          prev.set(key, { from: p.x + "," + p.y, x: nx, y: ny });
          q.push({ x: nx, y: ny });
        }
      }
      const end = target.x + "," + target.y;
      if (!prev.has(end)) return [];
      const out = [];
      let key = end;
      while (prev.get(key)) {
        const step = prev.get(key);
        out.push({ x: step.x, y: step.y });
        key = step.from;
      }
      return out.reverse();
    }
    function drawGuideRoute(rect, tile, camX, camY) {
      if (state.mode !== "explore" || state.inv.open || state.quiz.open || state.help.open || state.guideMode === "off") return;
      const target = currentObjectiveTarget();
      if (!target) return;
      const idle = state.t - state.lastMoveAt;
      if (state.guideMode === "auto" && idle < 1.25) return;
      const route = routeTo(target);
      const alpha = state.guideMode === "route" ? 0.78 : Math.min(0.72, 0.2 + Math.max(0, idle - 0.8) * 0.18);
      ctx.save();
      ctx.globalAlpha = alpha;
      const cx = rect.x + (target.x + 0.5) * tile - camX;
      const cy = rect.y + (target.y + 0.5) * tile - camY;

      ctx.beginPath(); ctx.arc(cx, cy, tile * (0.38 + 0.08 * Math.sin(state.t * 5)), 0, Math.PI * 2); ctx.stroke();
      for (let i = 0; i < route.length; i += 2) {
        const p = route[i];
        const x = rect.x + (p.x + 0.5) * tile - camX;
        const y = rect.y + (p.y + 0.5) * tile - camY;
        ctx.fillStyle = i % 4 ? C.green2 : C.amber;
        ctx.fillRect(x - 2, y - 2, 4, 4);

      const tTile = (state.map.grid[target.y] || [])[target.x];
      const selfLabeled = tTile === "W" || (FILES[state.activeFile].focus || []).some(p => p.x === target.x && p.y === target.y);
      if (!selfLabeled && (state.guideMode === "route" || idle > 1.6) && state.t >= state.bot.until) txt(ctx, target.label, cx, cy - tile * 0.62 - 16, Math.max(9, tile * 0.3), C.amber, "center", "700");
      ctx.restore();

    function drawMiniPanel(x, y, w, h, title, body, color) {

            txt(ctx, "7", gx + tile / 2, gy + tile * 0.22, Math.max(13, tile * 0.5), C.amber, "center", "900");
